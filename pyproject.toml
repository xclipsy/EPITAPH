[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epitaph"
version = "0.1.0"
description = "Documentación viva, local y no destructiva para proyectos de código"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "eclipse" }]
keywords = ["documentation", "readme", "llm", "local-first", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "httpx>=0.27",
  "pathspec>=0.12",
  "pydantic>=2.7",
  "rich>=13.7",
  "prompt_toolkit>=3.0.40",
  "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
epitaph = "epitaph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/epitaph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
